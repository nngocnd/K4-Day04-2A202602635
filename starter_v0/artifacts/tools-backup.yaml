# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# If a tool is renamed, keep the name synchronized across:
#   this file -> tools/__init__.py -> data/eval_base.json
#   -> data/eval_helpdesk_extension.json -> report/demo text
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Sử dụng khi người dùng đưa thiếu thông tin bắt buộc (VD: không có id, tên dịch vụ,...). HOẶC cần xin xác nhận từ người dùng trước khi thực hiện hành động tạo ticket"
    parameters:
      type: object
      properties:
        question: { type: string, default: "", description: "Câu hỏi" }
        response_type:
          {
            type: string,
            enum: [text, yes_no, choice],
            default: "text",
            description: "Kiểu trả lời",
          }
        options:
          {
            type: array,
            default: [],
            items: { type: string },
            description: "Các lựa chọn",
          }
      required: [question]

  - name: search_kb
    description:
      "Tìm hướng dẫn kỹ thuật, xử lý sự cố máy móc, cài đặt phần mềm (How-to
      guides / Troubleshooting)."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Nội dung cần tìm" }
        category:
          {
            type: string,
            enum:
              [
                all,
                vpn,
                email,
                wifi,
                printing,
                account,
                security,
                hardware,
                software,
                meeting_room,
              ],
            default: "all",
            description: "Nhóm hướng dẫn",
          }
        top_k: { type: integer, default: 3, description: "Số kết quả" }
      required: [query]

  - name: check_service_status
    description: "Chỉ dùng cho hạ tầng dịch vụ dùng chung toàn công ty (vpn,
      email, sso, wifi, printing). KHÔNG dùng để kiểm tra máy tính cá nhân của một nhân viên."
    parameters:
      type: object
      properties:
        service:
          {
            type: string,
            enum: [vpn, email, sso, wifi, printing],
            description: "Tên dịch vụ",
          }
        environment:
          {
            type: string,
            enum: [production, staging],
            default: "production",
            description: "Môi trường",
          }
      required: [service]

  - name: inspect_device
    description:
      "Chỉ dùng để kiểm tra chẩn đoán 1 thiết bị cụ thể khi đã có asset_id
      (ví dụ ASSET-101). KHÔNG dùng khi sự cố là mất mạng toàn công ty."
    parameters:
      type: object
      properties:
        asset_id: { type: string, description: "Mã tài sản" }
        check:
          {
            type: string,
            enum: [all, network, vpn, security, hardware, software],
            default: "all",
            description: "Nhóm kiểm tra",
          }
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu người dùng trong danh bạ hỗ trợ."
    parameters:
      type: object
      properties:
        employee_id: { type: string, description: "Mã nhân viên" }
      required: [employee_id]

  - name: format_incident_report
    description:
      "Mô tả rõ format đầu ra của các findings và các template hỗ trợ (brief, technical,
      handoff)."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: { type: string }
              detail: { type: string }
              source: { type: string }
              status: { type: string }
        template:
          {
            type: string,
            enum: [brief, technical, handoff],
            default: "brief",
            description: "Mẫu báo cáo",
          }
        incident_title:
          { type: string, default: "IT incident", description: "Tiêu đề" }
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer:
          { type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo" }
        model:
          {
            type: string,
            description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4",
          }
        query_type:
          {
            type: string,
            enum: [specs, drivers, support, compatibility],
            default: "support",
            description: "Loại thông tin cần tìm",
          }
        max_results:
          { type: integer, default: 3, description: "Số kết quả, tối đa 5" }
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Nội dung cần tìm" }
        policy_area:
          {
            type: string,
            enum:
              [
                all,
                access_control,
                data_privacy,
                external_tools,
                incident_response,
                service_operations,
                ticketing,
              ],
            default: "all",
            description: "Nhóm chính sách",
          }
        top_k: { type: integer, default: 3, description: "Số mục" }
      required: [query]

  - name: create_ticket
    description:
      "Chỉ được gọi khi người dùng đã xác nhận rõ ràng (confirmed: true).
      Cấm tự ý tạo ticket khi chưa hỏi người dùng qua clarify."
    parameters:
      type: object
      properties:
        summary: { type: string, default: "", description: "Tóm tắt sự cố" }
        priority:
          {
            type: string,
            enum: [low, medium, high, critical],
            default: "medium",
            description: "Mức ưu tiên",
          }
        asset_id:
          { type: string, default: "", description: "Mã tài sản nếu có" }
        confirmed:
          {
            type: boolean,
            default: false,
            description: "Đã được người dùng xác nhận",
          }
      required: [summary]
